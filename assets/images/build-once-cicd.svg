<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 720" role="img" aria-labelledby="title desc">
  <title id="title">Build once, promote everywhere</title>
  <desc id="desc">A CI/CD flow where one verified container artifact is promoted unchanged through development, staging and production.</desc>
  <defs>
    <style>
      .bg{fill:#fff}.title{font:700 48px system-ui,-apple-system,sans-serif;fill:#10233f}.sub{font:24px system-ui,-apple-system,sans-serif;fill:#66758a}.box{fill:#fff;stroke:#cad5e1;stroke-width:2}.blue{fill:#edf6ff;stroke:#2887e8;stroke-width:3}.green{fill:#f0faf3;stroke:#52ae72;stroke-width:2}.h{font:700 24px system-ui,-apple-system,sans-serif;fill:#10233f}.p{font:18px system-ui,-apple-system,sans-serif;fill:#66758a}.small{font:16px system-ui,-apple-system,sans-serif;fill:#66758a}.mono{font:17px ui-monospace,SFMono-Regular,monospace;fill:#315a86}.arrow{stroke:#6d7d90;stroke-width:4;fill:none;marker-end:url(#a)}.garrow{stroke:#42a866;stroke-width:4;fill:none;marker-end:url(#g)}
    </style>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#6d7d90"/></marker>
    <marker id="g" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#42a866"/></marker>
  </defs>
  <rect class="bg" width="1440" height="720"/>
  <text class="title" x="720" y="70" text-anchor="middle">Build once, promote everywhere</text>
  <text class="sub" x="720" y="108" text-anchor="middle">One artifact, multiple environments</text>

  <rect class="box" x="45" y="190" rx="16" width="190" height="220"/>
  <text class="h" x="140" y="245" text-anchor="middle">Pull Request</text>
  <text class="p" x="140" y="285" text-anchor="middle">code changes</text>
  <text class="p" x="140" y="315" text-anchor="middle">trigger CI</text>

  <path class="arrow" d="M235 300 H285"/>
  <rect class="box" x="300" y="160" rx="16" width="230" height="280"/>
  <text class="h" x="415" y="215" text-anchor="middle">Quality Gates</text>
  <text class="small" x="350" y="260">✓ Lint</text>
  <text class="small" x="350" y="295">✓ Typecheck</text>
  <text class="small" x="350" y="330">✓ Tests</text>
  <text class="small" x="350" y="365">✓ Migrations</text>
  <text class="small" x="350" y="400">✓ Security</text>

  <path class="arrow" d="M530 300 H580"/>
  <rect class="blue" x="595" y="170" rx="16" width="230" height="260"/>
  <text class="h" x="710" y="235" text-anchor="middle">Build Image Once</text>
  <rect x="665" y="270" width="90" height="70" rx="10" fill="#2887e8"/>
  <path d="M665 270 L710 245 L755 270 L710 295 Z" fill="#64adf2"/>
  <text class="p" x="710" y="385" text-anchor="middle">single BuildKit invocation</text>

  <path class="arrow" d="M825 300 H875"/>
  <rect class="box" x="890" y="150" rx="16" width="240" height="300"/>
  <text class="h" x="1010" y="205" text-anchor="middle">Verified Candidate</text>
  <rect x="940" y="230" width="140" height="38" rx="10" fill="#eef2f6"/>
  <text class="mono" x="1010" y="255" text-anchor="middle">sha256:abc123...</text>
  <text class="small" x="940" y="310">✓ Scan</text>
  <text class="small" x="940" y="345">✓ SBOM</text>
  <text class="small" x="940" y="380">✓ Signature</text>
  <text class="small" x="940" y="415">✓ Provenance</text>

  <path class="garrow" d="M1130 300 H1180"/>
  <path class="garrow" d="M1180 300 V210 H1220"/>
  <path class="garrow" d="M1180 300 H1220"/>
  <path class="garrow" d="M1180 300 V390 H1220"/>
  <rect class="green" x="1230" y="155" rx="14" width="165" height="110"/>
  <text class="h" x="1312" y="205" text-anchor="middle">Dev</text>
  <text class="small" x="1312" y="235" text-anchor="middle">same digest</text>
  <rect class="green" x="1230" y="275" rx="14" width="165" height="110"/>
  <text class="h" x="1312" y="325" text-anchor="middle">Staging</text>
  <text class="small" x="1312" y="355" text-anchor="middle">same digest</text>
  <rect class="green" x="1230" y="395" rx="14" width="165" height="110"/>
  <text class="h" x="1312" y="445" text-anchor="middle">Production</text>
  <text class="small" x="1312" y="475" text-anchor="middle">same digest</text>

  <rect x="340" y="550" width="760" height="105" rx="16" fill="#f6f8fa" stroke="#d7dee7"/>
  <text class="h" x="720" y="595" text-anchor="middle">The important invariant</text>
  <text class="p" x="720" y="630" text-anchor="middle">Build once. Test, scan, sign and attest that artifact. Promote it without rebuilding.</text>
</svg>